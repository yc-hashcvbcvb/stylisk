<meta name="description" content="Stylisk to studio stron internetowych. Gotowa strona w 3–4 dni, płacisz dopiero po akceptacji. Umów bezpłatną konsultację.">

<style>
:root{
  --bg:#fbfbfd; --bg2:#f5f5f7; --card:#ffffff;
  --fg:#1d1d1f; --fg2:#6e6e73; --line:rgba(0,0,0,.1);
  --accent:#5b49f5; --on-accent:#fff;
  --font:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --gutter:24px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --bg2:#0c0c0f; --card:#161619;
    --fg:#f5f5f7; --fg2:#a1a1a6; --line:rgba(255,255,255,.12);
    --accent:#a79bff; --on-accent:#0a0a12;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --bg2:#0c0c0f; --card:#161619;
  --fg:#f5f5f7; --fg2:#a1a1a6; --line:rgba(255,255,255,.12);
  --accent:#a79bff; --on-accent:#0a0a12;
}
.dark{
  --bg:#050507; --bg2:#0c0c10; --card:#141418;
  --fg:#f5f5f7; --fg2:#9d9da6; --line:rgba(255,255,255,.12);
  --accent:#a79bff; --on-accent:#0a0a12;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%;overflow-x:hidden}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:min(1120px,calc(100% - var(--gutter) * 2));margin-inline:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid transparent;background:var(--fg);color:var(--bg);font-weight:500;font-size:16px;letter-spacing:-.01em;text-align:center;transition:transform .2s ease,opacity .2s ease}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.28;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:color-mix(in srgb,var(--fg) 8%,transparent);opacity:1}
.btn.sm{min-height:36px;padding:0 16px;font-size:14px;white-space:nowrap}
.btn.lt{background:#f5f5f7;color:#0a0a0c}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(5,5,7,.62);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid rgba(255,255,255,.08);color:#f5f5f7}
.nav .in{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.03em}
.brand svg{width:30px;height:30px;flex:none;overflow:visible}
.nav ul{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:14px;color:#c7c7cc}
.nav ul a{transition:color .2s}.nav ul a:hover{color:#fff}
.nav .right{display:flex;align-items:center;gap:10px}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.1)}
.lang button{border:0;background:transparent;color:#c7c7cc;font-size:12px;font-weight:600;letter-spacing:.02em;height:28px;min-width:34px;border-radius:999px;padding:0 8px;transition:background .2s,color .2s}
.lang button[aria-pressed="true"]{background:#f5f5f7;color:#0a0a0c}
.chip{display:none;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(167,155,255,.5);background:rgba(167,155,255,.12);color:#d9d4ff;font-size:13px;font-weight:500;white-space:nowrap}
.chip.show{display:inline-flex}
.chip i{width:7px;height:7px;border-radius:50%;background:#7dffb2;box-shadow:0 0 10px #7dffb2}
.nav .btn{background:#f5f5f7;color:#0a0a0c}
@media (max-width:980px){.chip{display:none!important}}
@media (max-width:820px){.nav ul{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--bg);color:var(--fg);padding:clamp(100px,15vh,136px) 0 0;text-align:center;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:
  radial-gradient(55% 45% at 50% 0%,rgba(110,91,255,.42),transparent 70%),
  radial-gradient(30% 25% at 85% 18%,rgba(255,138,91,.14),transparent 70%),
  radial-gradient(40% 30% at 12% 30%,rgba(86,160,255,.12),transparent 70%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.flare{position:absolute;left:50%;top:clamp(190px,30vh,290px);height:2px;width:0;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#fff 50%,transparent);box-shadow:0 0 36px 6px rgba(167,155,255,.55);opacity:.35;z-index:-1;animation:flare 2s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes flare{from{width:0;opacity:0}35%{opacity:1}to{width:min(1200px,92vw);opacity:.35}}
.hero h1{font-size:clamp(3rem,12vw,9rem);font-weight:600;letter-spacing:-.055em;line-height:.94}
.hero h1 span{display:block;animation:rise 1.3s cubic-bezier(.2,.8,.2,1) both}
.hero h1 span.gw{display:inline;animation:none;padding:0 .12em .06em 0;margin-right:-.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(135deg,#a79bff,#ff9d76);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero h1 span:nth-child(2){animation-delay:.25s;font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.03em;padding-bottom:.08em}
@keyframes rise{from{opacity:0;filter:blur(14px);transform:translateY(26px)}to{opacity:1;filter:blur(0);transform:none}}
.hero .sub{max-width:580px;margin:26px auto 0;font-size:clamp(1.02rem,2vw,1.3rem);color:var(--fg2);letter-spacing:-.01em;animation:rise 1.2s .55s cubic-bezier(.2,.8,.2,1) both}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px;animation:rise 1.2s .75s cubic-bezier(.2,.8,.2,1) both}
.hero .btn:not(.ghost){background:#f5f5f7;color:#0a0a0c}

.stage{perspective:1700px;margin-top:clamp(32px,6vw,60px);padding-inline:var(--gutter)}
.device{--p:0;width:min(1060px,100%);margin-inline:auto;border-radius:22px 22px 0 0;background:#0b0b0f;border:1px solid rgba(255,255,255,.14);border-bottom:0;box-shadow:0 -30px 120px -20px rgba(110,91,255,.45);transform-origin:50% 100%;transform:rotateX(calc((1 - var(--p)) * 24deg)) scale(calc(.9 + var(--p) * .1));will-change:transform;overflow:hidden;text-align:left}
.dbar{display:flex;align-items:center;gap:7px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.dbar i{width:10px;height:10px;border-radius:50%;background:#2a2a30;flex:none}
.dbar span{margin:0 auto;transform:translateX(-18px);font-size:12px;color:#8d8d96;background:#17171c;padding:5px clamp(20px,8vw,60px);border-radius:999px}
.dscreen{padding:clamp(14px,3vw,22px) clamp(16px,3.4vw,34px) clamp(20px,4vw,40px);min-height:clamp(250px,42vw,520px);background:radial-gradient(70% 60% at 75% 30%,rgba(110,91,255,.28),transparent 70%),#08080b}
.m-nav{display:flex;align-items:center;gap:18px;color:#cfcfd6;font-size:12px}
.m-nav b{font-weight:600;font-size:14px;margin-right:auto;color:#fff}
.m-nav em{font-style:normal;padding:6px 14px;border-radius:99px;background:#fff;color:#000;font-weight:500}
.m-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;margin-top:clamp(18px,4vw,56px)}
.m-hero h4{font-size:clamp(1.5rem,4.6vw,3.6rem);font-weight:600;letter-spacing:-.045em;line-height:.98;color:#fff}
.m-hero h4 i{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.m-hero p{margin-top:14px;max-width:300px;font-size:clamp(10px,1.3vw,14px);color:#8d8d96;line-height:1.45}
.m-btn{margin-top:16px;display:inline-block;padding:8px 18px;border-radius:99px;background:linear-gradient(135deg,#a79bff,#ff9d76);color:#0a0a0c;font-size:clamp(10px,1.2vw,13px);font-weight:600}
.m-art{aspect-ratio:1;justify-self:end;width:min(100%,340px);display:grid;place-items:center}
.orb{width:78%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,#a79bff,#5b49f5,#ff9d76,#a79bff);box-shadow:0 0 90px rgba(143,123,255,.55),inset 0 0 60px rgba(255,255,255,.25);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.m-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:clamp(18px,4vw,50px)}
.m-cards div{height:clamp(38px,8vw,96px);border-radius:12px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,#17171d,#0e0e12)}

/* sections */
section{position:relative}
.pad{padding:clamp(44px,7vw,84px) 0}
.center{text-align:center}
h2.title{font-size:clamp(2.2rem,6vw,4.6rem);font-weight:600;letter-spacing:-.045em;line-height:1.04;overflow-wrap:break-word}
.lede{margin-top:18px;font-size:clamp(1.02rem,2vw,1.35rem);color:var(--fg2);letter-spacing:-.01em;max-width:620px}
.center .lede{margin-inline:auto}

.statement{background:transparent}
.statement p.big{font-size:clamp(1.8rem,5.2vw,4rem);font-weight:600;letter-spacing:-.045em;line-height:1.1;max-width:15em;margin-inline:auto}
.statement p.big em{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;color:var(--fg2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(28px,5vw,52px);text-align:left}
.trio div{padding:28px 32px 4px;border-left:1px solid var(--line)}
.trio div:first-child{border-left:0;padding-left:0}
.trio h3{font-size:1.2rem;font-weight:600;letter-spacing:-.02em}
.trio p{margin-top:8px;color:var(--fg2);font-size:1rem}
@media (max-width:760px){.trio{grid-template-columns:1fr}.trio div{border-left:0;border-top:1px solid var(--line);padding:22px 0}.trio div:first-child{border-top:0}}

/* services */
.services{background:transparent}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:40px auto 26px}
.tab{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--fg2);white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.svc{display:grid;grid-template-columns:.9fr 1.1fr;background:var(--card);border-radius:32px;overflow:hidden;min-height:0;text-align:left}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.svc-side{padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;background:radial-gradient(90% 70% at 0% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.svc-side h3{font-size:clamp(1.8rem,3.6vw,2.8rem);font-weight:600;letter-spacing:-.04em;line-height:1.05}
.svc-side p{margin-top:12px;color:var(--fg2);font-size:1.08rem;max-width:22em}
.svc-side small{display:block;color:var(--fg2);font-size:.95rem;margin-bottom:16px}
.svc-list{list-style:none;margin:0;padding:clamp(8px,2vw,24px) clamp(24px,4vw,52px)}
.svc-list li{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.svc-list li:last-child{border-bottom:0}
.svc-list strong{display:block;font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.svc-list span.d{display:block;color:var(--fg2);font-size:.95rem;margin-top:2px}
.price{font-size:1.45rem;font-weight:600;letter-spacing:-.03em;white-space:nowrap;text-align:right}
.price small{display:block;font-size:.78rem;font-weight:400;color:var(--fg2);letter-spacing:0;margin-bottom:-2px}
.price .per{font-size:.9rem;font-weight:400;color:var(--fg2)}
.talk{padding:clamp(24px,5vw,60px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.talk h4{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:600;letter-spacing:-.035em;line-height:1.1}
.talk p{color:var(--fg2);max-width:26em}
.talk .btn{align-self:flex-start;margin-top:8px}
.incl{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:64px;text-align:left}
.incl h4{font-size:1.05rem;font-weight:600;letter-spacing:-.015em}
.incl p{margin-top:8px;color:var(--fg2);font-size:.97rem}
.fine{margin-top:26px;color:var(--fg2);font-size:.9rem}
@media (max-width:860px){.svc{grid-template-columns:1fr;min-height:0}.incl{grid-template-columns:1fr 1fr;margin-top:48px}.svc-side{padding-bottom:12px}}
@media (max-width:700px){
  .tabs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;margin-inline:calc(var(--gutter) * -1);padding:4px var(--gutter) 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .svc{border-radius:26px}
  .svc-list li{padding:18px 0;gap:14px}
  .price{font-size:1.2rem}
}
@media (max-width:520px){.incl{grid-template-columns:1fr;gap:24px}}

/* process */
.process{background:transparent}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:44px;position:relative;text-align:left}
.steps::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:var(--line)}
.step{position:relative;padding-top:38px}
.step::before{content:"";position:absolute;top:0;left:0;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);box-shadow:0 0 0 6px var(--bg)}
.step time{display:block;color:var(--accent);font-weight:500;font-size:.95rem}
.step h3{margin-top:6px;font-size:1.5rem;font-weight:600;letter-spacing:-.035em}
.step p{margin-top:8px;color:var(--fg2);font-size:1rem}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr;row-gap:32px;margin-top:36px}.steps::before{display:none}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* work */
.work{background:transparent}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:22px;text-align:left}
.tile .shot{aspect-ratio:16/10;border-radius:28px;overflow:hidden;padding:26px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.tile h4{margin-top:16px;font-size:1.1rem;font-weight:600;letter-spacing:-.02em}
.tile p{color:var(--fg2);font-size:.95rem}
.shot .mn{display:flex;justify-content:space-between;font-size:11px;opacity:.8}
.shot .hd{font-size:clamp(1.9rem,3.3vw,2.7rem);line-height:.98}
.shot .pill{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:99px;font-size:12px;font-weight:600}
.s1{background:radial-gradient(80% 60% at 70% 90%,#7a3b5e,transparent 70%),#1b0f19;color:#f6e7ee}
.s1 .hd{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;font-size:clamp(2.1rem,3.8vw,3.2rem)}
.s1 .pill{background:#f6e7ee;color:#1b0f19}
.s1::after{content:"";position:absolute;right:-12%;bottom:12%;width:55%;aspect-ratio:.5;border-radius:50% 50% 12px 12px;background:linear-gradient(180deg,#ffd9a8,#c4743f);opacity:.9}
.s2{background:#e8ff6b;color:#0b1a00}
.s2 .hd{font-weight:700;letter-spacing:-.06em}
.s2 .pill{background:#0b1a00;color:#e8ff6b}
.s2::after{content:"";position:absolute;right:-20%;bottom:-14%;width:80%;aspect-ratio:1;border-radius:50%;border:26px solid #0b1a00;opacity:.9}
.s3{background:linear-gradient(170deg,#eaf3ff,#cfe3ff);color:#0e2442}
.s3 .hd{font-weight:500;letter-spacing:-.05em}
.s3 .pill{background:#2766e8;color:#fff}
.s3::after{content:"";position:absolute;right:10%;bottom:10%;width:46%;aspect-ratio:1;border-radius:32%;background:rgba(255,255,255,.7);box-shadow:0 20px 60px rgba(39,102,232,.25)}
.shot>*{position:relative;z-index:1}
@media (max-width:860px){.tiles{grid-template-columns:1fr;max-width:420px;margin-inline:auto}}

/* booking */
.book{background:linear-gradient(180deg,var(--bg) 72%,#000);color:var(--fg);overflow:hidden;isolation:isolate}
.book::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 50% at 90% 0%,rgba(110,91,255,.32),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(255,138,91,.1),transparent 70%)}
.bk-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,88px);align-items:start}
.bk-grid>*{min-width:0}
.bk-copy{position:sticky;top:96px}
.bk-copy h2{font-size:clamp(2.2rem,5.6vw,4.4rem);font-weight:600;letter-spacing:-.05em;line-height:1.02;overflow-wrap:break-word}
.bk-copy ul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px}
.bk-copy li{display:flex;gap:12px;align-items:center;color:#d6d6dc;font-size:1.02rem}
.bk-copy li svg{flex:none;width:20px;height:20px;color:var(--accent)}
.bk-card{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:32px;padding:clamp(20px,3.4vw,40px);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.bk-card h3{font-size:1.45rem;font-weight:600;letter-spacing:-.03em}
.bk-card .sm{color:var(--fg2);font-size:.95rem;margin-top:4px}
.lab{display:block;margin:26px 0 12px;font-size:.95rem;font-weight:500;color:#d6d6dc}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{min-width:0;padding:11px 0 10px;border-radius:16px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .2s,border-color .2s,color .2s}
.day span{font-size:12px;color:var(--fg2);line-height:1.3;white-space:nowrap}
.day b{font-size:1.45rem;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.day:hover{border-color:rgba(255,255,255,.35)}
.day[aria-pressed="true"]{background:#f5f5f7;border-color:#f5f5f7;color:#0a0a0c}
.day[aria-pressed="true"] span{color:#55555d}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:46px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:15px;transition:background .2s,border-color .2s,color .2s}
.slot:hover{border-color:rgba(255,255,255,.35)}
.slot[aria-pressed="true"]{background:#f5f5f7;color:#0a0a0c;border-color:#f5f5f7}
.empty{color:var(--fg2);padding:18px;border:1px dashed var(--line);border-radius:16px;font-size:.95rem}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px;flex-wrap:wrap}
.foot .pick{color:var(--fg2);font-size:.95rem;flex:1 1 180px}
.foot .pick b{color:var(--fg);font-weight:500}
.fields{display:grid;gap:14px;margin-top:20px}
.fields .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{min-width:0}
.f label{display:block;font-size:.9rem;color:#c3c3cb;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-height:48px;transition:border-color .2s,background .2s;appearance:none;-webkit-appearance:none}
.f select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8' fill='none' stroke='%23a1a1a6' stroke-width='2'><path d='M1 1l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 16px center;padding-right:40px}
.f select option{color:#111;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.09)}
.f textarea{min-height:96px;resize:vertical}
.f input::placeholder,.f textarea::placeholder{color:#76767f}
.err{min-height:1.3em;color:#ff9d9d;font-size:.9rem;margin-top:10px}
@media (max-width:900px){.bk-grid{grid-template-columns:minmax(0,1fr)}.bk-copy{position:static}}
@media (max-width:560px){
  .bk-card{border-radius:26px}
  .fields .two{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
  .days{gap:6px}
  .day b{font-size:1.3rem}
  .foot .btn{flex:1 1 100%}
  .foot .btn.ghost{flex:0 0 auto;flex-basis:auto}
}

/* ticket */
.ticket{animation:swap .6s cubic-bezier(.2,.8,.2,1)}
.ok{display:flex;align-items:center;gap:10px;color:#7dffb2;font-weight:500;font-size:.98rem}
.ok svg{width:26px;height:26px}
.ok circle{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .7s .1s ease forwards}
.ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tk-when{margin-top:20px;font-size:clamp(1.9rem,5vw,3.2rem);font-weight:600;letter-spacing:-.045em;line-height:1.04;overflow-wrap:break-word}
.tk-when span{display:block;font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.02em;color:var(--accent)}
.tk-meta{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;margin:26px 0 0;padding:24px 0 0;border-top:1px dashed var(--line)}
.tk-meta dt{font-size:.82rem;color:var(--fg2)}
.tk-meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.tk-meta .wide{grid-column:1/-1}
.tk-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.tk-note{margin-top:20px;color:var(--fg2);font-size:.9rem}
.tk-sub{display:flex;gap:20px;margin-top:20px;font-size:.95rem;flex-wrap:wrap}
.tk-sub button{background:none;border:0;padding:8px 0;color:var(--fg2);text-decoration:underline;text-underline-offset:4px}
.tk-sub button:hover{color:var(--fg)}
@media (max-width:560px){.tk-meta{grid-template-columns:1fr}.tk-act .btn{flex:1 1 100%}}

footer{background:#000;color:#a1a1a6;padding:52px 0 60px;font-size:.92rem}
footer .row{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:center}
footer .brand{color:#f5f5f7}
footer nav{display:flex;gap:10px 24px;flex-wrap:wrap}
footer a:hover{color:#fff}

/* phones */
@media (max-width:600px){
  :root{--gutter:20px}
  body{font-size:16px}
  .nav .in{height:54px}
  .brand{font-size:18px}
  .nav .btn.sm{padding:0 14px;font-size:13px}
  .nav .right{gap:8px}
  .hero .cta .btn{flex:1 1 100%}
  .m-nav span{display:none}
  .m-hero{grid-template-columns:1.15fr .85fr;gap:10px}
  .m-art{width:100%}
  .stage{margin-top:44px}
  .statement p.big{max-width:none}
  .tile .shot{padding:22px}
}
@media (max-width:360px){
  .brand span.w{display:none}
  .lang button{min-width:30px;padding:0 6px}
}

/* ===== dodatki: światło w tle, śnieg, animacje, nowe sekcje ===== */
main,footer{position:relative;z-index:1}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;will-change:transform}
.ambient i:nth-child(1){width:60vw;height:60vw;left:-18vw;top:6vh;background:radial-gradient(circle,rgba(110,91,255,.26),transparent 66%);animation:drift1 28s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:52vw;height:52vw;right:-16vw;top:34vh;background:radial-gradient(circle,rgba(255,138,91,.16),transparent 66%);animation:drift2 34s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:46vw;height:46vw;left:24vw;bottom:-18vw;background:radial-gradient(circle,rgba(86,160,255,.16),transparent 66%);animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(10vw,14vh,0) scale(1.12)}}
@keyframes drift2{to{transform:translate3d(-12vw,-10vh,0) scale(1.1)}}
@keyframes drift3{to{transform:translate3d(8vw,-12vh,0) scale(1.15)}}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
/* płynne przejścia: jedna ciągła poświata na całej wysokości strony, bez ucinania przy krawędziach sekcji */
main::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(38vw 38vw at 6% 16%,rgba(110,91,255,.20),transparent 70%),
  radial-gradient(32vw 32vw at 96% 23%,rgba(255,138,91,.11),transparent 70%),
  radial-gradient(40vw 40vw at 92% 38%,rgba(110,91,255,.18),transparent 70%),
  radial-gradient(34vw 34vw at 4% 50%,rgba(86,160,255,.15),transparent 70%),
  radial-gradient(40vw 40vw at 55% 62%,rgba(110,91,255,.15),transparent 70%),
  radial-gradient(32vw 32vw at 96% 74%,rgba(255,138,91,.09),transparent 70%)}
:root{--pbg:#fbfbfd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pbg:#000}}
:root[data-theme="dark"]{--pbg:#000}
.statement{isolation:isolate}
.statement::before{content:"";position:absolute;left:0;right:0;top:0;height:clamp(120px,16vw,220px);z-index:-1;pointer-events:none;background:linear-gradient(180deg,#050507,rgba(5,5,7,.55) 38%,transparent)}
.book{background:none}
.book::before{background:radial-gradient(50% 50% at 90% 0%,rgba(110,91,255,.32),transparent 70%),radial-gradient(40% 40% at 0% 100%,rgba(255,138,91,.1),transparent 70%),linear-gradient(180deg,var(--bg) 72%,#000);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 clamp(120px,16vw,240px));mask-image:linear-gradient(180deg,transparent 0,#000 clamp(120px,16vw,240px))}
.ig{display:inline-flex;align-items:center;gap:8px}
.ig svg{width:18px;height:18px}
.ig-pill{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#d6d6dc;font-size:.97rem;transition:border-color .25s,background .25s,color .25s}
.ig-pill svg{width:18px;height:18px;color:var(--accent)}
.ig-pill:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.09);color:#fff}

/* pojawianie się */
.js .rv{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .8s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

/* cennik */
.badge{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:9px 18px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:.98rem;font-weight:500;letter-spacing:-.01em}
.badge i{width:8px;height:8px;border-radius:50%;background:#2fd37c;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,211,124,.55)}70%,100%{box-shadow:0 0 0 10px rgba(47,211,124,0)}}
.svc{transition:box-shadow .5s ease}
.svc:hover{box-shadow:0 30px 80px -40px color-mix(in srgb,var(--accent) 70%,transparent)}
.svc-side .btn{transition:transform .2s ease,opacity .2s ease}
.svc-side .btn:hover{transform:translateY(-2px)}

/* statystyki: kwadratowe karty */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:clamp(28px,4vw,44px);text-align:left}
.stat{position:relative;overflow:hidden;aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(22px,2.6vw,32px);border-radius:28px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--card) 92%,transparent),color-mix(in srgb,var(--card) 70%,transparent));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);isolation:isolate;transition:border-color .35s ease,box-shadow .45s ease}
.stat::before{content:"";position:absolute;z-index:-1;right:-22%;top:-22%;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 26%,transparent),transparent 68%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.stat::after{content:"";position:absolute;z-index:-1;right:-9%;top:-9%;width:46%;aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);opacity:.7;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.stat:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 26px 60px -34px color-mix(in srgb,var(--accent) 85%,transparent)}
.stat:hover::before{transform:scale(1.18)}
.stat:hover::after{transform:scale(1.12) rotate(20deg)}
.stat .ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.stat .ic svg{width:22px;height:22px}
.stat b{display:block;width:fit-content;font-size:clamp(3rem,6vw,4.6rem);font-weight:600;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--fg) 40%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat h4{margin-top:12px;font-size:1.2rem;font-weight:600;letter-spacing:-.025em}
.stat p{margin-top:6px;color:var(--fg2);font-size:.95rem;line-height:1.45}
@media (max-width:980px){.stat p{font-size:.9rem}}
@media (max-width:860px){.stats{grid-template-columns:1fr;max-width:420px;margin-inline:auto}.stat{aspect-ratio:auto;min-height:250px;gap:34px}}
.sub-h{margin-top:clamp(36px,5vw,56px);font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:600;letter-spacing:-.035em}

/* realizacje (prawdziwe strony) */
a.tile{display:block;color:inherit}
.tile .shot{aspect-ratio:16/10;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease}
a.tile:hover .shot{transform:translateY(-6px);box-shadow:0 28px 60px -26px rgba(110,91,255,.6)}
.tile .go{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--accent);font-weight:500;font-size:.95rem}
.tile .go::after{content:"\2197";transition:transform .3s ease}
a.tile:hover .go::after{transform:translate(3px,-3px)}
.s4{background:radial-gradient(70% 55% at 85% 105%,rgba(255,157,118,.38),transparent 70%),linear-gradient(160deg,#18181d,#0a0a0d);color:#f5f5f7}
.s4 .hd{font-weight:700;letter-spacing:-.05em;text-transform:uppercase;font-size:clamp(1.9rem,3.4vw,2.8rem)}
.s4 .pill{background:#f5f5f7;color:#0a0a0c}
.s4::after{content:"";position:absolute;left:-12%;right:-12%;bottom:-38%;height:62%;border-radius:50%;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 70px rgba(255,157,118,.2)}
.s5{background:radial-gradient(70% 60% at 85% 8%,rgba(80,140,255,.46),transparent 70%),linear-gradient(170deg,#0d1b3a,#070d1f);color:#eaf1ff}
.s5 .hd{font-weight:600;letter-spacing:-.045em;font-size:clamp(1.7rem,3vw,2.5rem);max-width:9em}
.s5 .hd i{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.s5 .pill{background:#5aa2ff;color:#04112b}
.s5::after{content:"";position:absolute;right:7%;bottom:14%;width:32%;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(170,205,255,.4);animation:spin 40s linear infinite}
@media (max-width:860px){.tile .shot{aspect-ratio:4/3}}

/* opinie */
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px;text-align:left}
.rev{margin:0;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px;justify-content:flex-start;transition:border-color .3s ease,box-shadow .4s ease}
.rev:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 22px 50px -30px color-mix(in srgb,var(--accent) 80%,transparent)}
.rev .stars{color:#ffb45e;letter-spacing:3px;font-size:.95rem}
.rev blockquote{margin:0;font-family:var(--serif);font-size:1.4rem;line-height:1.28;letter-spacing:-.01em}
.rev .who{margin-top:auto;padding-top:6px}
.rev .who b{display:block;font-weight:600;letter-spacing:-.01em}
.rev .who span{color:var(--fg2);font-size:.92rem}
@media (max-width:900px){.reviews{grid-template-columns:1fr;max-width:520px;margin-inline:auto}}

/* rezerwacja: dni (14 dni, 7 w rzędzie) i ticket */
.day.we span{color:color-mix(in srgb,var(--accent) 80%,var(--fg2))}
.day[aria-pressed="true"].we span{color:#55555d}
@media (max-width:560px){
  .days{display:flex;overflow-x:auto;gap:6px;margin-inline:-4px;padding:0 4px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 58px}
}
.meet{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.meet small{display:block;color:var(--fg2);font-size:.82rem}
.meet b{display:block;margin-top:2px;font-size:1.2rem;font-weight:600;letter-spacing:.03em;overflow-wrap:anywhere}
.meet span{display:block;margin-top:2px;color:#d6d6dc;font-size:.95rem}
.tk-status{margin:18px 0 0;font-size:.93rem;color:var(--fg2)}
.tk-status.good{color:#7dffb2}
.tk-status.warn{color:#ffc98a}
.ticket h3{margin-bottom:4px}
.btn.busy{opacity:.55;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1;transform:none}
  #snow{display:none}
}
.meet .btn{min-height:40px;padding:0 18px;font-size:15px;white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .device{transform:none}
}

/* ===== RESPONSIVE LAYER v2 ===== */
/* safe-area było liczone podwójnie (html + fixed nav) -> zostaje tylko w nav/footerze */
:root{padding-top:0;padding-bottom:0}
html{overflow-x:clip}
footer{padding-bottom:max(60px,calc(env(safe-area-inset-bottom,0px) + 36px))}
img,svg,canvas{max-width:100%}
.hero h1,.hero .sub{overflow-wrap:break-word}

/* kreska pod nagłówkiem: w przepływie dokumentu, więc nigdy nie nachodzi na tekst */
.flare{position:relative;left:50%;top:auto;transform:translateX(-50%);display:block;height:2px;width:min(1200px,92vw);margin:clamp(20px,3.4vw,36px) 0 0;opacity:.35;z-index:-1;pointer-events:none;box-shadow:0 0 28px 4px rgba(167,155,255,.5)}
@media (max-width:600px){.flare{margin-top:22px;box-shadow:0 0 20px 3px rgba(167,155,255,.5)}.hero .sub{margin-top:22px}}

/* duże monitory */
@media (min-width:1500px){
  .wrap{width:min(1280px,calc(100% - var(--gutter) * 2))}
  .device{width:min(1180px,100%)}
}

/* nawigacja na wąskich telefonach: nic się nie ściska */
@media (max-width:400px){
  .brand span.w{display:none}
  .nav .btn.sm{padding:0 12px;font-size:12.5px}
  .lang button{min-width:32px;padding:0 7px}
}

/* --- karuzele (przesuwane palcem) zamiast długich kolumn jedna pod drugą --- */
@media (max-width:900px){
  .reviews{display:flex;max-width:none;margin:22px calc(var(--gutter) * -1) 0;padding:4px var(--gutter) 14px;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .reviews::-webkit-scrollbar{display:none}
  .reviews .rev{flex:0 0 min(84%,380px);scroll-snap-align:start}
  .js .reviews .rv{opacity:1;transform:none}
}
@media (max-width:860px){
  .stats{display:flex;max-width:none;margin:28px calc(var(--gutter) * -1) 0;padding:4px var(--gutter) 14px;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:0 0 min(78%,320px);scroll-snap-align:start;min-height:240px;gap:28px}
  .js .stats .rv{opacity:1;transform:none}
  .steps{grid-template-columns:1fr 1fr;gap:28px 20px}
  .tiles{grid-template-columns:1fr 1fr;max-width:none;margin-inline:0}
}
@media (max-width:760px){
  .trio{display:flex;gap:12px;margin-inline:calc(var(--gutter) * -1);padding:0 var(--gutter) 12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .trio::-webkit-scrollbar{display:none}
  .trio div,.trio div:first-child{flex:0 0 min(80%,320px);scroll-snap-align:start;border:1px solid var(--line);border-radius:22px;padding:22px 22px 24px;background:color-mix(in srgb,var(--card) 80%,transparent)}
  .js .trio .rv{opacity:1;transform:none}
}
@media (max-width:600px){
  .tiles{display:flex;margin:22px calc(var(--gutter) * -1) 0;padding:4px var(--gutter) 14px;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tiles::-webkit-scrollbar{display:none}
  .tiles .tile{flex:0 0 min(86%,360px);scroll-snap-align:start}
  .js .tiles .rv{opacity:1;transform:none}
}
/* kroki: 2 w rzędzie także na telefonie (zamiast 4 pod sobą) */
@media (max-width:520px){
  .steps{grid-template-columns:1fr 1fr;gap:26px 16px;margin-top:30px}
  .step{padding-top:34px}
  .step h3{font-size:1.2rem}
  .step p{font-size:.92rem}
  .step time{font-size:.88rem}

  /* ---------- delikatny śnieg (kropeczki) ---------- */
  (function snow(){
    var cv = document.getElementById("snow");
    if(!cv || reduce || !cv.getContext) return;
    var ctx = cv.getContext("2d"), W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), flakes = [], running = true;
    function make(init){ return {x:Math.random()*W, y:init ? Math.random()*H : -8, r:Math.random()*1.4+.6, v:Math.random()*.32+.14, a:Math.random()*.35+.22, s:Math.random()*6.28, w:Math.random()*.7+.25}; }
    function size(){
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
      var n = Math.round(Math.min(56, Math.max(24, W*H/26000)));
      while(flakes.length < n) flakes.push(make(true));
      flakes.length = n;
    }
    function frame(){
      if(!running) return;
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<flakes.length;i++){
        var f = flakes[i];
        f.y += f.v; f.s += .008; f.x += Math.sin(f.s) * f.w * .35;
        if(f.y > H + 8 || f.x < -10 || f.x > W + 10){ flakes[i] = make(false); f = flakes[i]; f.x = Math.random()*W; }
        ctx.beginPath(); ctx.fillStyle = "rgba(168,156,255," + f.a + ")"; ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
      }

    }

      notes: b.notes || "—",
      when: whenStr(b),
      consultation_language: clangName(b.clang || b.lang || "pl"),   // {{consultation_language}}
      language: clangName(b.clang || b.lang || "pl"),
      client_name: b.name,
      client_email: b.email,
      client_phone: b.phone,
      client_notes: b.notes || "—",
      meeting_date: fmtFull(b.date),
      meeting_time: b.time,
      meeting_when: whenStr(b),
      meeting_timezone: t("tz"),
      meet_link: link,
      meet_code: meetCode(),
      cancel_link: cancelUrl(b)
    };
  }
  function sendMail(templateId, params){
    var c = CONFIG.EMAILJS;
    return emailjs.send(c.SERVICE_ID, templateId, params).then(function(r){
      if(!r || r.status !== 200) throw new Error("mail");
      return true;
    });
  }
  function toClient(b, kind, m){ return sendMail(CONFIG.EMAILJS.TEMPLATE_CLIENT, mailParams(b, kind, b.email, CONFIG.STUDIO_EMAIL, m)); }
  function toStudio(b, kind, m){ return sendMail(CONFIG.EMAILJS.TEMPLATE_STUDIO, mailParams(b, kind, CONFIG.STUDIO_EMAIL, b.email, m)); }
  function siteUrl(){ return CONFIG.SITE_URL || (location.protocol === "file:" ? location.href.split("#")[0] : location.origin + location.pathname); }
  function enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
  function dec(s){ try{ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
  function cancelUrl(b){ return siteUrl()+"#anuluj="+enc({i:b.id, d:b.date, t:b.time, n:b.name, e:b.email, p:b.phone}); }
  function meetCode(){ var m = /meet\.google\.com\/([a-z0-9\-]+)/i.exec(CONFIG.MEET_LINK || ""); return m ? m[1] : ""; }
  function newId(){ return Math.random().toString(36).slice(2,8); }

  function loadSaved(){
    var b = sGet(KEY);
    if(b && b.date && b.time && atTime(b.date,b.time).getTime() > Date.now() - 30*60000){ bk.saved = b; bk.step = "done"; }
    else { if(b) sDel(KEY); bk.saved = null; if(bk.step === "done") bk.step = "pick"; }
  }
  function updateChip(){
    if(bk.saved){
      chipText.textContent = t("chip") + fmtShort(bk.saved.date) + ", " + bk.saved.time;
      chip.classList.add("show"); navBtn.textContent = t("nav_btn_view");
    } else { chip.classList.remove("show"); navBtn.textContent = t("nav_btn"); }
  }

  function renderBooking(){
    if(bk.step === "cancelAsk" && bk.cancel) return renderCancelAsk();
    if(bk.step === "cancelled" && bk.cancelled) return renderCancelled();
    if(bk.step === "done" && bk.saved) return renderTicket(false);
    if(bk.step === "details") return renderDetails();
    renderPick();
  }

  function renderPick(){
    var daysHtml = DAYS.map(function(d){
      var k = dkey(d), w = d.getDay();
      var wd = new Intl.DateTimeFormat(loc(),{weekday:"short"}).format(d);
      var mo = new Intl.DateTimeFormat(loc(),{month:"short"}).format(d);
      return '<button type="button" class="day'+((w===0||w===6)?' we':'')+'" data-d="'+k+'" aria-pressed="'+(bk.date===k)+'" aria-label="'+esc(fmtLong(k))+'"><span>'+esc(wd)+'</span><b>'+d.getDate()+'</b><span>'+esc(mo)+'</span></button>';
    }).join("");
    var slotsHtml = bk.date
      ? '<div class="slots">'+slotsFor(bk.date).map(function(x){ return '<button type="button" class="slot" data-t="'+x+'" aria-pressed="'+(bk.time===x)+'">'+x+'</button>'; }).join("")+'</div>'
      : '<div class="empty">'+esc(t("pick_day"))+'</div>';
    var pick = (bk.date && bk.time) ? '<span class="pick"><b>'+esc(fmtLong(bk.date))+'</b> '+esc(t("at"))+' <b>'+bk.time+'</b></span>' : '<span class="pick">'+esc(t("pick_none"))+'</span>';
    el.innerHTML =
      '<h3>'+esc(t("pick_h"))+'</h3><p class="sm">'+esc(t("pick_sub"))+'</p>'+
      '<span class="lab">'+esc(t("day"))+'</span><div class="days">'+daysHtml+'</div>'+
      '<span class="lab">'+esc(t("time"))+'</span>'+slotsHtml+
      '<div class="foot">'+pick+'<button type="button" class="btn lt" id="toDetails"'+((bk.date&&bk.time)?'':' disabled')+'>'+esc(t("next"))+'</button></div>';
    el.onclick = function(e){
      var d = e.target.closest(".day"), s = e.target.closest(".slot"), c = e.target.closest("#toDetails");
      if(d){ bk.date = d.getAttribute("data-d"); bk.time = null; renderPick(); }
      else if(s){ bk.time = s.getAttribute("data-t"); renderPick(); }
      else if(c && !c.disabled){ bk.step = "details"; renderDetails(); }
    };
  }

  function renderDetails(){
    if(!form.clangSet) form.clang = lang;
    var clang = form.clang || lang;
    el.innerHTML =
      '<h3>'+esc(t("det_h"))+'</h3><p class="sm"><b style="color:var(--fg);font-weight:500">'+esc(fmtLong(bk.date))+' '+esc(t("at"))+' '+bk.time+'</b></p>'+
      '<form id="bf" class="fields" novalidate>'+
        '<div class="two"><div class="f"><label for="f-name">'+esc(t("f_name"))+'</label><input id="f-name" autocomplete="name" placeholder="'+esc(t("ph_name"))+'" value="'+esc(form.name)+'"></div>'+
        '<div class="f"><label for="f-phone">'+esc(t("f_phone"))+'</label><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="'+esc(t("ph_phone"))+'" value="'+esc(form.phone)+'"></div></div>'+
        '<div class="two"><div class="f"><label for="f-email">'+esc(t("f_email"))+'</label><input id="f-email" type="email" inputmode="email" autocomplete="email" placeholder="'+esc(t("ph_email"))+'" value="'+esc(form.email)+'"></div>'+
        '<div class="f"><label id="l-clang">'+esc(t("f_lang"))+'</label><input type="hidden" id="f-clang" value="'+clang+'"><div class="slots" id="clangPick" role="group" aria-labelledby="l-clang" style="grid-template-columns:1fr 1fr"><button type="button" class="slot" style="height:48px" data-c="pl" aria-pressed="'+(clang === "pl")+'">Polski</button><button type="button" class="slot" style="height:48px" data-c="en" aria-pressed="'+(clang === "en")+'">English</button></div></div></div>'+
        '<div class="f"><label for="f-notes">'+esc(t("f_notes"))+' <span style="color:var(--fg2)">'+esc(t("optional"))+'</span></label><textarea id="f-notes" placeholder="'+esc(t("ph_notes"))+'">'+esc(form.notes)+'</textarea></div>'+
        '<div class="err" id="err" role="alert"></div>'+
        '<div class="foot" style="margin-top:4px"><button type="button" class="btn ghost" id="back">'+esc(t("back"))+'</button><button type="submit" class="btn lt" id="go">'+esc(t("confirm"))+'</button></div>'+
      '</form>';
    el.onclick = null;
    var f = el.querySelector("#bf");
    function grab(){ form.name = f["f-name"].value.trim(); form.phone = f["f-phone"].value.trim(); form.email = f["f-email"].value.trim(); form.notes = f["f-notes"].value.trim(); var cl = f["f-clang"]; if(cl && (cl.value === "pl" || cl.value === "en")){ if(cl.value !== form.clang || form.clangSet){ form.clangSet = true; } form.clang = cl.value; } }
    f.addEventListener("input", grab); f.addEventListener("change", grab);
    f.querySelector("#clangPick").addEventListener("click", function(e){
      var b = e.target.closest(".slot"); if(!b) return;
      var v = b.getAttribute("data-c"); f["f-clang"].value = v; form.clang = v; form.clangSet = true;
      var all = f.querySelectorAll("#clangPick .slot");
      for(var i=0;i<all.length;i++){ all[i].setAttribute("aria-pressed", String(all[i] === b)); }
    });
    f.querySelector("#back").addEventListener("click", function(){ grab(); bk.step = "pick"; renderPick(); });
    f.addEventListener("submit", function(e){
      e.preventDefault(); grab();
      var err = f.querySelector("#err"), digits = form.phone.replace(/\D/g, "");
      if(!form.name){ err.textContent = t("e_name"); f["f-name"].focus(); return; }
      if(!/^[+\d][\d\s\-().]{6,}$/.test(form.phone) || digits.length < 9 || digits.length > 15){ err.textContent = t("e_phone"); f["f-phone"].focus(); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email)){ err.textContent = t("e_email"); f["f-email"].focus(); return; }
      err.textContent = "";
      if(go_busy(f)) return;
      var sig = [bk.date, bk.time, form.name, form.phone, form.email, form.notes, form.clang].join("|");
      if(!attempt || attempt.sig !== sig){ attempt = {id:(attempt && attempt.id) || newId(), sig:sig, studio:false}; }
      var rec = {id:attempt.id, date:bk.date, time:bk.time, name:form.name, phone:form.phone, email:form.email, notes:form.notes, createdAt:Date.now(), mail:"sent", lang:lang, clang:(form.clang === "en" ? "en" : "pl")};
      if(!emailReady()){ err.textContent = t("e_send"); return; }
      var go = f.querySelector("#go"), goLabel = go.textContent; go.textContent = t("sending"); go.classList.add("busy");
      var when = whenStr(rec), link = CONFIG.MEET_LINK;
      /* 1) najpierw powiadomienie dla studia (żeby rezerwacja nigdy nie została "potwierdzona" bez wiedzy studia),
         2) potem potwierdzenie dla klienta. Potwierdzenie na stronie pojawia się dopiero, gdy OBA maile wyszły. */
      var step1 = attempt.studio ? Promise.resolve(true) : toStudio(rec, "booking", t("mail_studio")(rec, when, link)).then(function(){ attempt.studio = true; });
      step1.then(function(){ return toClient(rec, "booking", t("mail_client")(rec, when, link, meetCode(), cancelUrl(rec))); })
        .then(function(){ attempt = null; finishBooking(rec); })
        .catch(function(){
          go.textContent = goLabel; go.classList.remove("busy");
          err.textContent = t("e_send");
        });
    });
  }
  function finishBooking(rec){ sSet(KEY, rec); bk.saved = rec; bk.step = "done"; updateChip(); renderTicket(true); }

  function gcalUrl(b){
    var s = atTime(b.date,b.time), e = new Date(s.getTime()+15*60000);
    function f(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00"; }
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t("cal_title"))+
      "&dates="+f(s)+"/"+f(e)+"&details="+encodeURIComponent(t("cal_det")(CONFIG.MEET_LINK))+(CONFIG.MEET_LINK?"&location="+encodeURIComponent(CONFIG.MEET_LINK):"")+"&ctz=Europe/Warsaw";
  }
  function mailtoStudio(m, subjectOverride){
    return "mailto:"+(CONFIG.STUDIO_EMAIL||"")+"?subject="+encodeURIComponent(subjectOverride || m.s)+"&body="+encodeURIComponent(m.b);
  }
  var CHECK = '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="13" r="11"/><path d="M8 13.4l3.4 3.4L18 9.8"/></svg>';

  function renderTicket(fresh){
    var b = bk.saved, when = whenStr(b), code = meetCode(), link = CONFIG.MEET_LINK;
    var meet = link
      ? '<div class="meet"><div><small>'+esc(t("tk_meet"))+(code?' · '+esc(t("tk_code")):'')+'</small><b>'+esc(code || link)+'</b></div><a class="btn lt" target="_blank" rel="noopener" href="'+esc(link)+'">'+esc(t("tk_join"))+'</a></div>'
      : '<div class="meet"><div><small>'+esc(t("tk_meet"))+'</small><span>'+esc(t("tk_nolink"))+'</span></div></div>';
    var status = b.mail === "sent" ? '<p class="tk-status good">'+esc(t("tk_sent"))+esc(b.email)+'</p>'
               : b.mail === "failed" ? '<p class="tk-status warn">'+esc(t("tk_fail"))+'</p>'
               : '<p class="tk-status">'+esc(CONFIG.STUDIO_EMAIL ? t("tk_manual") : t("tk_saved"))+'</p>';
    var m = t("mail_studio")(b, when, link);
    var sendBtn = (b.mail === "sent" || !CONFIG.STUDIO_EMAIL) ? '' : '<a class="btn lt" href="'+esc(mailtoStudio(m))+'">'+esc(t("tk_send"))+'</a>';
    el.innerHTML =
      '<div class="ticket"'+(fresh?'':' style="animation:none"')+'>'+
      '<div class="ok">'+CHECK+esc(fresh?t("tk_new"):t("tk_old"))+'</div>'+
      '<div class="tk-when">'+esc(fmtLong(b.date))+'<span>'+esc(t("at"))+' '+esc(b.time)+'</span></div>'+
      meet+
      '<dl class="tk-meta">'+
        '<div><dt>'+esc(t("tk_name"))+'</dt><dd>'+esc(b.name)+'</dd></div>'+
        '<div><dt>'+esc(t("tk_phone"))+'</dt><dd>'+esc(b.phone)+'</dd></div>'+
        '<div><dt>'+esc(t("tk_mail"))+'</dt><dd>'+esc(b.email)+'</dd></div>'+
        '<div><dt>'+esc(t("tk_fmt"))+'</dt><dd>'+esc(t("tk_fmtv"))+'</dd></div>'+
        (b.clang?'<div><dt>'+esc(t("tk_lang"))+'</dt><dd>'+esc(clangName(b.clang))+'</dd></div>':'')+
        (b.notes?'<div class="wide"><dt>'+esc(t("tk_notes"))+'</dt><dd>'+esc(b.notes)+'</dd></div>':'')+
      '</dl>'+
      status+
      '<div class="tk-act">'+sendBtn+'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(gcalUrl(b))+'">'+esc(t("tk_cal"))+'</a></div>'+
      '<div class="tk-sub"><button type="button" id="resched">'+esc(t("tk_res"))+'</button><button type="button" id="cancel">'+esc(t("tk_can"))+'</button></div>'+
      '</div>';
    el.onclick = null;
    el.querySelector("#resched").addEventListener("click", function(){
      form = {name:b.name, phone:b.phone, email:b.email, notes:b.notes, clang:b.clang || lang, clangSet:true};
      if(emailReady()){ var w = whenStr(b); toStudio(b, "cancel", t("mail_cancel_studio")(b, w)).catch(function(){}); }
      sDel(KEY); bk.saved = null; bk.date = null; bk.time = null; bk.step = "pick"; updateChip(); renderPick();
    });
    el.querySelector("#cancel").addEventListener("click", function(){ doCancel(b); });
    if(fresh){ var r = el.getBoundingClientRect(); if(r.top < 0 || r.bottom > window.innerHeight){ el.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"}); } }
  }

  /* ---- odwoływanie spotkania ---- */
  function doCancel(b){
    var cur = sGet(KEY); if(cur && cur.id === b.id){ sDel(KEY); bk.saved = null; updateChip(); }
    bk.step = "cancelled"; bk.cancelled = {b:b, mail: emailReady() ? "sending" : "manual"};
    if(location.hash.indexOf("#anuluj=") === 0 && window.history && history.replaceState){ history.replaceState(null, "", location.pathname + location.search + "#book"); }
    renderBooking();
    if(emailReady()){
      var w = whenStr(b), ms = t("mail_cancel_studio")(b, w), mc = t("mail_cancel_client")(b, w, siteUrl()+"#book");
      Promise.all([toStudio(b, "cancel", ms), toClient(b, "cancel", mc)])
        .then(function(){ bk.cancelled.mail = "sent"; }).catch(function(){ bk.cancelled.mail = "failed"; })
        .then(function(){ if(bk.step === "cancelled") renderBooking(); });
    }
  }
  function renderCancelAsk(){
    var b = bk.cancel;
    el.innerHTML =
      '<div class="ticket"><h3>'+esc(t("cn_h"))+'</h3>'+
      '<div class="tk-when">'+esc(fmtLong(b.date))+'<span>'+esc(t("at"))+' '+esc(b.time)+'</span></div>'+
      '<div class="tk-act"><button type="button" class="btn lt" id="cnYes">'+esc(t("cn_yes"))+'</button><button type="button" class="btn ghost" id="cnNo">'+esc(t("cn_no"))+'</button></div></div>';
    el.onclick = null;
    el.querySelector("#cnYes").addEventListener("click", function(){ doCancel(b); });
    el.querySelector("#cnNo").addEventListener("click", function(){
      if(window.history && history.replaceState){ history.replaceState(null, "", location.pathname + location.search + "#book"); }
      bk.cancel = null; bk.step = bk.saved ? "done" : "pick"; renderBooking();
    });
  }
  function renderCancelled(){
    var c = bk.cancelled, b = c.b, w = whenStr(b);
    var status = c.mail === "sending" ? '<p class="tk-status">'+esc(t("cn_sending"))+'</p>'
               : c.mail === "sent" ? '<p class="tk-status good">'+esc(t("cn_sent"))+'</p>'
               : '<p class="tk-status warn">'+esc(t("cn_fail"))+'</p>';
    var send = ((c.mail === "failed" || c.mail === "manual") && CONFIG.STUDIO_EMAIL) ? '<a class="btn ghost" href="'+esc(mailtoStudio(t("mail_cancel_studio")(b, w)))+'">'+esc(t("cn_send"))+'</a>' : '';
    el.innerHTML =
      '<div class="ticket"><div class="ok">'+CHECK+esc(t("cn_done"))+'</div>'+
      '<div class="tk-when">'+esc(fmtLong(b.date))+'<span>'+esc(t("at"))+' '+esc(b.time)+'</span></div>'+
      '<p class="tk-note">'+esc(t("cn_done_p"))+'</p>'+status+
      '<div class="tk-act"><button type="button" class="btn lt" id="newBk">'+esc(t("cn_new"))+'</button>'+send+'</div></div>';
    el.onclick = null;
    el.querySelector("#newBk").addEventListener("click", function(){ bk.cancelled = null; bk.date = null; bk.time = null; bk.step = "pick"; renderBooking(); });
  }
  function checkCancelHash(){
    var m = /[#&]anuluj=([^&]+)/.exec(location.hash || ""); if(!m) return;
    var d = dec(m[1]); if(!d || !d.d || !d.t) return;
    bk.cancel = {id:d.i, date:d.d, time:d.t, name:d.n || "", email:d.e || "", phone:d.p || ""}; bk.step = "cancelAsk";
    setTimeout(function(){ var s = document.getElementById("book"); if(s) s.scrollIntoView({behavior: reduce ? "auto" : "smooth"}); }, 250);
  }

  /* ---------- language switch ---------- */
  function setLang(l){
    if(l === lang) return;
    lang = l; sSet("stylisk:lang", l);
    applyStatic(); observeCounters(); renderBooking(); updateChip();
  }
  document.querySelector(".lang").addEventListener("click", function(e){
    var b = e.target.closest("button[data-l]"); if(b) setLang(b.getAttribute("data-l"));
  });

  /* ---------- init ---------- */
  if(!CONFIG.MEET_LINK && window.console){ console.warn("[Stylisk] CONFIG.MEET_LINK jest pusty — maile i potwierdzenie nie będą zawierały linku do Google Meet."); }
  applyStatic(); observeCounters(); loadSaved(); checkCancelHash(); renderBooking(); updateChip(); updateDevice();
})();
</script>
</body>
</html>
