<style>
:root{--bg:#050507;--s1:#0e0e15;--s2:#181822;--b:#272734;--t:#f4f4f8;--m:#8e8ea0;--a:#7b6cff;--a2:#ef8aa5;--o:#ff8a5c;--ok:#3ddc97;--wn:#ffb454;--bd:#ff6b81;--dot:205,195,255;--g:linear-gradient(135deg,var(--a),var(--a2));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#050507;--s1:#0e0e15;--s2:#181822;--b:#272734;--t:#f4f4f8;--m:#8e8ea0;--dot:205,195,255;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6fb;--s1:#fff;--s2:#eeeef7;--b:#dcdce8;--t:#0b0b12;--m:#60606f;--dot:120,100,230;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f6fb;--s1:#fff;--s2:#eeeef7;--b:#dcdce8;--t:#0b0b12;--m:#60606f;--dot:120,100,230;color-scheme:light}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:radial-gradient(900px 480px at 78% -10%,rgba(123,108,255,.2),transparent 70%),radial-gradient(700px 400px at 0% 105%,rgba(239,138,165,.1),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}#app{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--b)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:16px}.lg{width:34px;height:34px;border-radius:50%;animation:glow 4s ease-in-out infinite}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav button{border:0;background:none;color:var(--m)}nav button:hover{color:var(--t)}nav button.on{background:var(--s2);color:var(--t);box-shadow:inset 0 -2px 0 var(--a)}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:10px;padding:8px 14px;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .2s,background .2s}
button:hover,.btn:hover{transform:translateY(-1px)}.pri{background:var(--g);color:#050507;border:0;font-weight:700}.pri:hover{box-shadow:0 6px 26px rgba(123,108,255,.45)}button:disabled{opacity:.4}
input,select,textarea{font:inherit;color:var(--t);background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px rgba(123,108,255,.25)}
main{max-width:1060px;margin:0 auto;padding:12px 20px 60px}
.card{background:color-mix(in srgb,var(--s1) 88%,transparent);border:1px solid var(--b);border-radius:18px;padding:20px;backdrop-filter:blur(8px)}
.hero{padding:30px;margin-top:22px;border-color:color-mix(in srgb,var(--a) 40%,var(--b))}.hero h1{font-size:30px;letter-spacing:-.035em;margin:0 0 4px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:26px;font-weight:600;padding:16px 18px;border-radius:14px;letter-spacing:.03em;margin-top:14px}
.res{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 9%,transparent)}.res>b{color:var(--rc);font-size:16px;display:block;margin-bottom:6px}.res .btn{margin:10px 8px 0 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.f3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.stat b{display:block;font-size:32px;letter-spacing:-.03em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 12px}h2,h3,h4{letter-spacing:-.02em;margin:0 0 8px}h3{margin-top:22px}label{display:block;margin:12px 0 4px}
.row{display:flex;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--b);cursor:pointer;flex-wrap:wrap;transition:background .2s,padding-left .2s}.row:hover{background:var(--s2);padding-left:24px}.row .c{flex:1 1 200px;min-width:0}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--b);color:var(--m);white-space:nowrap}
.p-interested{color:var(--ok);border-color:var(--ok)}.p-callback{color:var(--wn);border-color:var(--wn)}.p-declined,.p-invalid{color:var(--bd);border-color:var(--bd)}
.m{color:var(--m)}.alert{padding:10px 14px;border-radius:12px;border:1px solid currentColor;margin:10px 0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto}.modal .card{width:min(580px,100%);max-height:92vh;overflow:auto;background:var(--s1)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:500;font-size:12px}tr[onclick]:hover{background:var(--s2)}
.bar i{display:block;height:5px;border-radius:9px;background:var(--g);margin-top:4px;transition:width .6s}.hist{padding:10px 0;border-top:1px solid var(--b)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}@keyframes glow{50%{box-shadow:0 0 22px rgba(123,108,255,.6)}}

.anim .row{animation:up .45s both}.anim .row:nth-child(2){animation-delay:.05s}.anim .row:nth-child(3){animation-delay:.1s}.anim .row:nth-child(n+4){animation-delay:.15s}.anim .modal .card{animation:pop .3s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 <div class="card" style="padding:0;overflow:hidden">${rows.map(rowH).join('')||'<p class="m" style="padding:18px">Brak kontaktów.</p>'}</div>${all.length>100?`<p class="m">Pokazano 100 z ${all.length} — zawęź wyszukiwanie.</p>`:''}`}
async function add(){const f=S.f,k=pk(f.ph);if(k.length<7)return msg('Wpisz poprawny numer telefonu.');
 const d={id:k,company:f.co.trim(),phone:f.ph.trim(),person:f.pe.trim(),st:'new',createdAt:Date.now()};
 const{error}=await sb.from('contacts').insert({id:k,company:d.company,phone:d.phone,person:d.person,st:'new',by_name:me,created_at:d.createdAt});
 if(error)return msg(error.code=='23505'?'Ten numer już jest w bazie.':'Nie udało się dodać kontaktu.');
 S.C.unshift(d);S.f={co:'',ph:'',pe:''};op(k)}
function vList(st){const rows=S.C.filter(c=>c.st===st&&(!S.mine||c.lastBy===me)).sort(st=='callback'?(a,b)=>(a.cb||0)-(b.cb||0):(a,b)=>(b.lastAt||0)-(a.lastAt||0));
 return `<div class="top"><h2>${st=='callback'?'Do oddzwonienia':'Zainteresowani'}</h2><label class="m" style="margin:0"><input type="checkbox" style="width:auto" ${S.mine?'checked':''} onchange="S.mine=this.checked?1:0;render()"> Tylko moje</label></div><div class="card" style="padding:0;overflow:hidden">${rows.map(rowH).join('')||'<p class="m" style="padding:18px">Na razie pusto.</p>'}</div>`}
function modal(){const c=S.C.find(x=>x.id===S.open);if(!c)return'';const h=S.L.filter(l=>l.cid===c.id).sort((a,b)=>b.at-a.at),d=S.d;
 return `<div class="modal" onclick="if(event.target==this)cl()"><div class="card"><div class="top" style="margin-top:0"><div><h2 style="margin:0">${esc(co(c))}</h2><span class="pill p-${c.st||'new'}">${ST[c.st||'new']}</span></div><button onclick="cl()">✕</button></div>${al()}
 <p><a class="btn pri" href="tel:${esc(c.phone.replace(/[^\d+]/g,''))}">📞 Zadzwoń: ${esc(c.phone)}</a>${c.person?` <span class="m">${esc(c.person)}</span>`:''}</p>
 <label class="m">Wynik rozmowy</label><select id="m-o" onchange="S.d.o=this.value;render()"><option value="">Wybierz wynik…</option>${Object.entries(OUT).map(([k,v])=>`<option value="${k}" ${d.o==k?'selected':''}>${v[0]}</option>`).join('')}</select>
 ${d.o=='callback'?`<label class="m">Oddzwonić</label><input id="m-cb" type="datetime-local" value="${esc(d.cb)}" oninput="S.d.cb=this.value">`:''}
 <label class="m">Notatka</label><textarea id="m-n" rows="3" oninput="S.d.n=this.value">${esc(d.n)}</textarea>
 <p><button class="pri btn" onclick="save()">Zapisz rozmowę</button>${admin?` <button onclick="del('${c.id}')" style="color:var(--bd)">${S.dc==c.id?'Kliknij ponownie, aby usunąć':'Usuń kontakt'}</button>`:''}</p>
 <h4>Historia rozmów (${h.length})</h4>${h.map(l=>`<div class="hist"><b>${OUT[l.o]?OUT[l.o][0]:esc(l.o)}</b> <span class="m">· ${esc(nm(l.uid))} · ${fd(l.at)}</span>${l.note?`<div>${esc(l.note)}</div>`:''}</div>`).join('')||'<p class="m">Jeszcze nikt nie dzwonił.</p>'}</div></div>`}
async function save(){const c=S.C.find(x=>x.id===S.open),d=S.d,O=OUT[d.o];
 if(!O)return msg('Najpierw wybierz wynik rozmowy.');if(d.o=='callback'&&!d.cb)return msg('Wybierz datę i godzinę oddzwonienia.');
 const at=Date.now(),u={last_at:at,last_by:me,last_o:d.o};if(O[2]){u.st=O[2];u.cb=d.o=='callback'?new Date(d.cb).getTime():null}
 const a=await sb.from('calls').insert({cid:c.id,company:co(c),uid:me,o:d.o,ok:O[1],note:d.n.trim(),at});
 const b=a.error?a:await sb.from('contacts').update(u).eq('id',c.id);
 if(b.error)return msg('Nie udało się zapisać rozmowy — spróbuj ponownie.');
 S.open=null;S.msg='';render();S.sig='';await loadAll()}
async function del(id){if(S.dc!==id){S.dc=id;return render()}
 const{error}=await sb.from('contacts').delete().eq('id',id);if(error)return msg('Nie udało się usunąć kontaktu.');
 S.open=null;S.dc='';render();S.sig='';await loadAll()}
const since=r=>r=='all'?0:r=='1'?new Date().setHours(0,0,0,0):Date.now()-r*864e5;
const stats=L=>({n:L.length,ok:L.filter(l=>l.ok).length,i:L.filter(l=>l.o=='interested').length,cb:L.filter(l=>l.o=='callback').length});
const emps=()=>[...new Set([...S.T.map(x=>x.id),...S.L.map(l=>l.uid)])];
function vDash(){const L=S.L.filter(l=>l.at>=since(S.rg)),t=stats(L),rows=emps().map(id=>({id,...stats(L.filter(l=>l.uid==id))})).sort((a,b)=>b.n-a.n),mx=Math.max(1,...rows.map(r=>r.n));
 return `<div class="top"><h2>Panel zespołu</h2><select style="width:auto" onchange="S.rg=this.value;render()">${[['1','Dziś'],['7','Ostatnie 7 dni'],['30','Ostatnie 30 dni'],['all','Cały czas']].map(([v,l])=>`<option value="${v}" ${S.rg==v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="grid">${[['Wykonane połączenia',t.n],['Udane rozmowy',t.ok],['Zainteresowani',t.i],['Oddzwonienia',t.cb],['Kontakty w bazie',S.C.length]].map(([l,v])=>`<div class="card stat"><span class="m">${l}</span><b>${v}</b></div>`).join('')}</div><p class="m">Udana rozmowa = ktoś odebrał telefon.</p>
 <h3>Pracownicy</h3><div class="card" style="padding:0;overflow-x:auto"><table><tr><th>Pracownik</th><th>Połączenia</th><th>Udane</th><th>Skuteczność</th><th>Zainteresowani</th><th>Oddzwonienia</th></tr>${rows.map(r=>`<tr onclick="S.emp='${r.id}';go('act')" style="cursor:pointer"><td>${esc(nm(r.id))}${r.id==me?' (Ty)':''}</td><td><div class="bar" style="min-width:90px">${r.n}<i style="width:${r.n/mx*100}%"></i></div></td><td>${r.ok}</td><td>${r.n?Math.round(r.ok/r.n*100):0}%</td><td>${r.i}</td><td>${r.cb}</td></tr>`).join('')||'<tr><td colspan="6" class="m">Brak aktywności.</td></tr>'}</table></div>`}
function vAct(){const L=S.L.filter(l=>S.emp=='all'||l.uid==S.emp).slice().sort((a,b)=>b.at-a.at).slice(0,150);
 return `<div class="top"><h2>Cała aktywność</h2><select style="width:auto" onchange="S.emp=this.value;render()"><option value="all">Wszyscy</option>${emps().map(i=>`<option value="${i}" ${S.emp==i?'selected':''}>${esc(nm(i))}</option>`).join('')}</select></div><div class="card" style="padding:0;overflow:hidden">${L.map(l=>`<div class="row" onclick="op('${l.cid}')"><div class="c"><b>${esc(l.company)}</b><div class="m">${esc(nm(l.uid))} · ${fd(l.at)}</div>${l.note?`<div>${esc(l.note)}</div>`:''}</div><span class="pill ${l.ok?'p-interested':''}">${OUT[l.o]?OUT[l.o][0]:''}</span></div>`).join('')||'<p class="m" style="padding:18px">Brak zapisanych rozmów.</p>'}</div>`}
function vTeam(){return `<div class="top"><h2>Zespół</h2></div><div class="card"><p class="m" style="margin:0">Pracownicy wchodzą, wpisując imię i nazwisko, i pojawiają się tutaj po pierwszym wejściu. Możesz zablokować komuś dostęp do CRM.</p></div>
 <h3>Pracownicy</h3><div class="card" style="padding:0;overflow:hidden">${S.T.map(t=>{const off=S.O.some(o=>o.id===t.id);return `<div class="row" style="cursor:default"><div class="c"><b>${esc(nm(t.id))}</b><div class="m">Rozmów: ${stats(S.L.filter(l=>l.uid==t.id)).n}</div></div><span class="pill ${off?'p-declined':'p-interested'}">${off?'Zablokowany':'Aktywny'}</span><button onclick="blk('${t.id}',${!off})">${off?'Odblokuj':'Zablokuj'}</button></div>`}).join('')||'<p class="m" style="padding:18px">Nikt jeszcze nie wszedł na stronę.</p>'}</div>`}
async function blk(id,on){const r=on?await sb.from('blocked').insert({name:id}):await sb.from('blocked').delete().eq('name',id);S.msg=r.error?'Tylko administrator może to zmienić.':'';S.sig='';render();await loadAll()}
const sn=s=>String(s??'').replace(/[^\p{L}\s-]/gu,''),dg=s=>String(s??'').replace(/\D/g,''),normN=s=>sn(s).trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s-])\S/g,c=>c.toUpperCase());
function loginH(){return `<main><div class="card" style="max-width:420px;margin:12vh auto 0;text-align:center"><img class="lg" style="width:76px;height:76px" src="${LOGO}" alt=""><h2 style="margin:12px 0 4px">Stylisk CRM</h2><p class="m" style="margin:0 0 14px">Wpisz imię i nazwisko, aby wejść.</p>${S.lmsg?`<div class="alert" style="color:var(--wn)">${esc(S.lmsg)}</div>`:''}<input id="l-n" placeholder="Imię i nazwisko" autocomplete="name" value="${esc(S.ln)}" oninput="S.ln=this.value" onkeydown="if(event.key=='Enter')doLogin()"><input id="l-c" style="margin-top:10px" type="password" placeholder="Kod (tylko jeśli go masz)" oninput="S.lc=this.value" onkeydown="if(event.key=='Enter')doLogin()"><button class="pri btn" style="margin-top:14px;width:100%" onclick="doLogin()">Wejdź</button></div></main>`}
async function doLogin(){const n=normN(S.ln),c=(S.lc||'').trim();
 if(n.split(' ').length<2||n.length<5){S.lmsg='Wpisz imię i nazwisko.';return render()}
 S.lmsg='Logowanie…';render();
 try{if(!(await sb.auth.getSession()).data.session){const{error}=await sb.auth.signInAnonymously();if(error)throw error}
  const{data,error}=await sb.rpc('join_team',{p_name:n,p_code:c});if(error)throw error;
  me=sn(data.name);admin=!!data.admin;localStorage.setItem('sc_login',JSON.stringify({n}));S.login=0;S.lmsg='';S.lc='';
  await loadAll();S.ok=1;S.anim=1;render();if(!S.poll)S.poll=setInterval(()=>{if(!document.hidden)loadAll()},8000)}
 catch(e){S.login=1;S.lmsg=/kod|zablokowany|imię|Zaloguj/i.test(e.message||'')?e.message:'Nie udało się zalogować. Spróbuj ponownie.';render()}}
function out(){localStorage.removeItem('sc_login');sb.auth.signOut().finally(()=>location.reload())}
async function loadAll(){try{
 const[c,l,m,b]=await Promise.all([sb.from('contacts').select('*').order('created_at',{ascending:false}).limit(1000),sb.from('calls').select('*').order('at',{ascending:false}).limit(1000),sb.from('members').select('name'),sb.from('blocked').select('name')]);
 const er=[c,l,m,b].find(x=>x.error);if(er)throw er.error;
 const sig=JSON.stringify([c.data,l.data,m.data,b.data]);if(sig===S.sig)return;S.sig=sig;
 S.C=c.data.map(r=>({id:dg(r.id),company:r.company,phone:r.phone,person:r.person,st:r.st,createdAt:r.created_at,lastAt:r.last_at,lastBy:sn(r.last_by),lastO:r.last_o,cb:r.cb}));
 S.L=l.data.map(r=>({cid:dg(r.cid),company:r.company,uid:sn(r.uid),o:r.o,ok:r.ok,note:r.note,at:r.at}));
 S.T=[...new Map(m.data.map(r=>[sn(r.name).toLowerCase(),sn(r.name)])).values()].map(n=>({id:n}));S.O=b.data.map(r=>({id:sn(r.name)}));render()}
 catch(e){if(!S.ok){S.err='Nie udało się wczytać danych. Odśwież stronę.';render()}}}
addEventListener('keydown',e=>{if(e.key=='Escape'&&S.open)cl()});
(()=>{const c=$('#snow'),x=c.getContext('2d');let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(120,w/10|0)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.1+.5,v:Math.random()*.7+.2,d:Math.random()*6.3,a:Math.random()*.5+.25}))};rs();addEventListener('resize',rs);
 const f=()=>{x.clearRect(0,0,w,h);const k=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()||'205,195,255';P.forEach(p=>{p.y+=p.v;p.d+=.012;p.x+=Math.sin(p.d)*.4;if(p.y>h+5){p.y=-5;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=`rgba(${k},${p.a})`;x.fill()});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(f)};f()})();
(async()=>{
 if(!window.supabase||SB_URL.startsWith('WKLEJ')){S.err='Brak konfiguracji bazy danych — uzupełnij SB_URL i SB_KEY na początku pliku.';return render()}
 sb=supabase.createClient(SB_URL,SB_KEY);S.login=1;
 try{const sv=JSON.parse(localStorage.getItem('sc_login')||'null');if(sv&&sv.n){S.ln=sv.n;return doLogin()}}catch{}
 render();
})();
</script></body></html>
