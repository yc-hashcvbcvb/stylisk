<style>
:root{--bg:#07070b;--s1:#101018;--s2:#181822;--s3:#22222e;--b:#272734;--t:#f4f4f8;--m:#8e8ea0;--a:#7b6cff;--a2:#ef8aa5;--ok:#3ddc97;--wn:#ffb454;--bd:#ff6b81;--dot:205,195,255;--g:linear-gradient(135deg,var(--a),var(--a2));color-scheme:dark}
:root[data-theme="dark"]{--bg:#07070b;--s1:#101018;--s2:#181822;--s3:#22222e;--b:#272734;--t:#f4f4f8;--m:#8e8ea0;--ok:#3ddc97;--wn:#ffb454;--bd:#ff6b81;--dot:205,195,255;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6fb;--s1:#fff;--s2:#f1f1f8;--s3:#e6e6f1;--b:#dcdce8;--t:#0b0b12;--m:#5f5f70;--ok:#139a5f;--wn:#b46a00;--bd:#d33553;--dot:120,100,230;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f6fb;--s1:#fff;--s2:#f1f1f8;--s3:#e6e6f1;--b:#dcdce8;--t:#0b0b12;--m:#5f5f70;--ok:#139a5f;--wn:#b46a00;--bd:#d33553;--dot:120,100,230;color-scheme:light}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:radial-gradient(900px 480px at 78% -10%,rgba(123,108,255,.18),transparent 70%),radial-gradient(700px 400px at 0% 105%,rgba(239,138,165,.09),transparent 70%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.7}#app{position:relative;z-index:1}
header{position:sticky;top:0;z-index:9;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--b)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:16px}.lg{width:32px;height:32px;border-radius:50%;animation:glow 4s ease-in-out infinite}
nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--m);white-space:nowrap;padding:8px 12px}nav button:hover{color:var(--t);background:var(--s2);transform:none}nav button.on{background:var(--s2);color:var(--t);box-shadow:inset 0 -2px 0 var(--a)}
.badge{font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--s3);color:var(--t);text-align:center}.badge.hot{background:var(--bd);color:#fff}
.who{display:flex;align-items:center;gap:10px;margin-left:auto}.av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#050507;font-weight:800;font-size:12px}.wn{display:flex;flex-direction:column;line-height:1.2;font-size:13px}.wn small{font-size:11px}
button,.btn{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:12px;padding:9px 15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--a) 45%,var(--b))}button:active,.btn:active{transform:scale(.98)}
.pri{background:var(--g);color:#050507;border:0;font-weight:700}.pri:hover{box-shadow:0 8px 28px rgba(123,108,255,.45)}button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.ghost{background:none}.dang{color:var(--bd)}.wide{width:100%;padding:13px;font-size:16px;margin-top:18px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--t);background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:10px 13px;width:100%;transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px rgba(123,108,255,.25)}textarea{resize:vertical;min-height:84px}
main{max-width:1060px;margin:0 auto;padding:8px 20px calc(70px + env(safe-area-inset-bottom,0px))}
.card{background:color-mix(in srgb,var(--s1) 90%,transparent);border:1px solid var(--b);border-radius:20px;padding:20px;backdrop-filter:blur(8px)}
.hero{padding:28px;margin-top:20px;border-color:color-mix(in srgb,var(--a) 40%,var(--b))}.hero h1{font-size:30px;letter-spacing:-.035em;margin:0 0 2px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:28px;font-weight:600;padding:16px 20px;border-radius:16px;letter-spacing:.04em;margin-top:16px;font-variant-numeric:tabular-nums}
.hint{margin:12px 2px 0}
.res{margin-top:16px;padding:16px 18px;border-radius:16px;border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 9%,transparent)}.res>b{color:var(--rc);font-size:16px;display:block;margin-bottom:6px}.res .btn{margin-top:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.f3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.stats{margin-top:14px}.stat{padding:16px 18px}.stat span{font-size:13px}.stat b{display:block;font-size:30px;letter-spacing:-.03em;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.stat.click{cursor:pointer;transition:border-color .2s}.stat.click:hover{border-color:var(--a)}.stat.alarm{border-color:color-mix(in srgb,var(--bd) 60%,var(--b))}.stat.alarm b{background:none;color:var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 12px}h2,h3,h4{letter-spacing:-.02em;margin:0 0 8px}h2{font-size:20px}h3{margin-top:22px}h4{margin:20px 0 8px;font-size:14px}label{display:block;margin:12px 0 4px}
.srch{max-width:300px}.tog{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}.tog input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.chip{padding:6px 12px;border-radius:99px;font-size:13px;background:var(--s1);color:var(--m)}.chip.on{background:var(--s3);border-color:var(--a);color:var(--t)}
.list{padding:0;overflow:hidden}
.row{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--b);cursor:pointer;transition:background .2s}.row:last-child{border-bottom:0}.row:hover{background:var(--s2)}
.row .c{flex:1 1 220px;min-width:0;display:flex;flex-direction:column}.row .c b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .c .m{font-size:13px}
.when{min-width:150px;font-size:12px;color:var(--m);text-align:right}.when.late{color:var(--bd);font-weight:600}.go{color:var(--m);font-size:22px;line-height:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--b);color:var(--m);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;vertical-align:middle}.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{color:var(--a);border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.p-interested{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.p-callback{color:var(--wn);border-color:color-mix(in srgb,var(--wn) 45%,transparent);background:color-mix(in srgb,var(--wn) 8%,transparent)}
.p-declined,.p-invalid{color:var(--bd);border-color:color-mix(in srgb,var(--bd) 45%,transparent);background:color-mix(in srgb,var(--bd) 8%,transparent)}
.m{color:var(--m)}.alert{padding:12px 16px;border-radius:14px;border:1px solid currentColor;margin:14px 0}.empty{padding:30px 18px;text-align:center;color:var(--m);margin:0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sheet{width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--s1);padding:22px;overscroll-behavior:contain}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.mh h2{margin:0 0 4px;font-size:22px}.x{width:38px;height:38px;padding:0;border-radius:50%;flex:none}
.call{width:100%;padding:14px;font-size:17px}
.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.out{flex-direction:column;gap:4px;padding:12px 8px;font-size:13px;text-align:center;line-height:1.25}.out span{font-size:20px}
.out.on{border-color:var(--oc);background:color-mix(in srgb,var(--oc) 16%,var(--s2));box-shadow:inset 0 0 0 1px var(--oc)}
.ed{margin-top:18px;border-top:1px solid var(--b);padding-top:12px}.ed summary{cursor:pointer;color:var(--m);font-weight:500}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist{padding:10px 0;border-top:1px solid var(--b)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:500;font-size:12px}tr[onclick]:hover{background:var(--s2)}
.bar i{display:block;height:5px;border-radius:9px;background:var(--g);margin-top:4px;transition:width .6s}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--s2);border:1px solid var(--tc);box-shadow:0 12px 40px rgba(0,0,0,.4);font-weight:500;animation:toast .25s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}@keyframes sheet{from{transform:translateY(100%)}}@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}@keyframes glow{50%{box-shadow:0 0 22px rgba(123,108,255,.6)}}
.anim .card,.anim .stat{animation:up .6s cubic-bezier(.2,.7,.2,1) both}.anim .card:nth-of-type(2){animation-delay:.08s}.anim .card:nth-of-type(n+3){animation-delay:.15s}
.anim .row{animation:up .45s both}.anim .row:nth-child(2){animation-delay:.04s}.anim .row:nth-child(3){animation-delay:.08s}.anim .row:nth-child(n+4){animation-delay:.12s}.anim .modal .card{animation:pop .3s both}
@media(max-width:640px){
 header{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:8px}nav{order:3;flex-basis:100%}.wn{display:none}
 main{padding:4px 14px calc(70px + env(safe-area-inset-bottom,0px))}.hero{padding:20px;margin-top:14px}.hero h1{font-size:24px}.big{font-size:24px}.srch{max-width:none}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat span{font-size:11px;line-height:1.3;display:block}.stat b{font-size:24px}
 .row{padding:12px 14px;gap:6px 10px;flex-wrap:wrap}.when{text-align:left;min-width:0;flex-basis:100%;order:3}.go{display:none}
 .modal{place-items:end center;padding:0}.sheet{border-radius:22px 22px 0 0;max-height:94vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}.anim .modal .card{animation:sheet .3s cubic-bezier(.2,.7,.2,1) both}
 .outs{grid-template-columns:repeat(2,1fr)}th,td{padding:10px}
}
